name: Bug report
description: Tell us about a reproducible problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please remove any sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
      placeholder: I expected ... but instead ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable set of steps.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web application
        - Backend / Convex
        - Authentication
        - Shared UI
        - Developer tooling / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser/device, deployment environment, and relevant versions.
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or additional context
      description: Do not include credentials, tokens, or personal data.
