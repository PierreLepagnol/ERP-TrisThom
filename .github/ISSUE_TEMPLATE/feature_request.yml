name: Feature request
description: Propose a user-focused improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first so we can evaluate the outcome, not just a solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: As a ..., I need ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain what success looks like. Wireframes or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or other approaches, if any.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web application
        - Backend / Convex
        - Authentication
        - Shared UI
        - Developer tooling / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
